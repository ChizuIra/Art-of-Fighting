name: compile code before PR

on:
  pull_request:

jobs:
  run-command:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: DL openGL
        run: |
          echo "DL openGL"
      
          sudo apt update
          sudo apt install build-essential cmake pkg-config mesa-utils libgl1-mesa-dev libglu1-mesa-dev

      - name: DL libraylib
        run: |
          echo "DL libraylib"
          mkdir temp 
          cd temp
          wget --max-redirect=1 https://github.com/raysan5/raylib/releases/download/6.2/raylib-6.2_linux_amd64.tar.gz
          tar xzf raylib-6.2_linux_amd64.tar.gz 
          mv raylib-6.2_linux_amd64/lib/libraylib.a ../lib/
          cd ..
          rm -r temp/
          
      - name: Test compile
        run: |
          echo "compile"
          gcc nob.c -o nob
          ./nob
