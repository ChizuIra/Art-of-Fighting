name: compile code before PR

on:
  pull_request:

jobs:
  run-command:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run shell command
        run: |
          echo "Hello from a PR"
          mkdir temp 
          cd temp
          wget https://github.com/raysan5/raylib/releases/download/6.2/raylib-6.2_linux_amd64.tar.gz
          tar xzf raylib-6.2_linux_amd64.tar.gz 
          mv raylib-6.2_linux_amd64/lib/libraylib.a ..lib/
          cd ..
          rm -r temp/
          gcc nob.c -o nob
          ./nob
